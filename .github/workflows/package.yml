name: Package binaries

# Produces downloadable builds for manual testing. Run it from the Actions tab
# (Run workflow), or push a v* tag. Artifacts are kept for 14 days.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build nlohmann-json3-dev qt6-base-dev
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Test
        run: ctest --preset release
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Stage install tree
        run: |
          cmake --install build/release --prefix dist
          cp README.md LICENSE dist/
          cat > dist/RUN.txt <<'EOF'
          TrafficSim - Linux build (not a self-contained bundle)

          Requires Qt 6 Widgets runtime on the machine, e.g. on Ubuntu 24.04:
              sudo apt install libqt6widgets6

          Run the desktop harness:
              ./bin/trafficsim-desktop
              ./bin/trafficsim-desktop --editor --language th
          Run the headless CLI with a seed:
              ./bin/trafficsim-cli 42

          Results are NOT yet validated against field or reference data.
          EOF
      - uses: actions/upload-artifact@v5
        with:
          name: trafficsim-linux-x86_64
          path: dist/
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        # This action's latest major is v4; there is no v5. Do not bump it alongside the
        # actions/* steps - a blanket major bump broke packaging in 26d7399.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
      - name: Install JSON headers
        run: vcpkg install nlohmann-json:x64-windows
      - name: Configure
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build/native --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Stage install tree
        run: |
          cmake --install build/native --config Release --prefix dist
          Copy-Item README.md, LICENSE dist/
      - name: Bundle Qt runtime
        run: windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/bin/trafficsim-desktop.exe
      - name: Write run notes
        run: |
          @'
          TrafficSim - Windows x64 build (Qt runtime bundled)

          Run the desktop harness:
              bin\trafficsim-desktop.exe
              bin\trafficsim-desktop.exe --editor --language th
          Run the headless CLI with a seed:
              bin\trafficsim-cli.exe 42

          Results are NOT yet validated against field or reference data.
          '@ | Set-Content dist/RUN.txt
      - uses: actions/upload-artifact@v5
        with:
          name: trafficsim-windows-x64
          path: dist/
          retention-days: 14
